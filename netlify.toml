# Netlify configuration (free tier). The site is fully static: every computation runs in the
# visitor's browser (Web Workers), so no serverless or edge functions are needed.

[build]
  base = "dashboard"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Missing build files and data must be real 404s, not the app's HTML with status 200 (that would
# surface as a confusing module/JSON error, e.g. for a page left open across a redeploy).
# Redirect rules only apply when no file exists at the path.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

# Single-page app: every route is served by index.html (React Router handles it).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fingerprinted build assets never change: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# script-src allows exactly one inline script by hash: the free-plan Netlify badge (injected by
# Netlify as /.netlify/scripts/hud, rendered in a srcdoc iframe that inherits this policy). If Netlify
# changes that script, only the badge stops rendering; the dashboard is unaffected.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
